<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>1 元真实支付测试</title>
<style>body{font:16px/1.7 system-ui,sans-serif;max-width:760px;margin:32px auto;padding:0 18px;background:#f6f7f9;color:#182333}main{background:white;border:1px solid #dce1e8;border-radius:16px;padding:28px}h1{font-size:25px}h2{font-size:20px;margin-top:28px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b8c3d4;border-radius:7px;font:inherit}button{font:inherit;border:0;border-radius:8px;padding:10px 16px;background:#1665d8;color:white;margin:14px 8px 0 0;cursor:pointer}button:disabled{opacity:.45;cursor:default}code{overflow-wrap:anywhere;font-size:14px}.muted{font-size:14px;color:#596577}.good{color:#12733a}#error{color:#b52a29;white-space:pre-wrap}#qr{width:240px;height:240px;display:block;margin:18px auto}#qr[hidden]{display:none}#payment-status{font-size:21px;font-weight:600}</style>
<main><h1>1 元真实支付测试</h1><p>本次实际支付金额固定为 <strong>¥1.00</strong>，款项由上游平台收取，用于验证支付宝收款和支付通知。此测试不提供 ChatGPT 订阅。</p>
<h2>① 登记本次回调</h2><p class="muted">在 Quefa「Webhook 回调」登记以下完整地址，将生成的独立 Webhook Secret 填到下方。密钥仅在本机加密保存。</p><code id="callback">正在读取地址…</code>
<form id="setup" autocomplete="off"><label for="secret">Webhook Secret</label><input id="secret" type="password" maxlength="4096" required autocomplete="new-password" spellcheck="false"><button id="save" type="submit">加密保存回调密钥</button></form>
<p id="callback-state" class="muted" aria-live="polite"></p><button id="test" type="button" disabled>发送测试通知</button>
<h2>② 支付这笔 1 元测试单</h2><button id="create" type="button" disabled>生成这笔 1 元付款码</button><p class="muted">同一测试单在刷新或重启后继续保留。扫码前请在支付宝核对金额为 1.00 元。</p>
<p id="merchant" class="muted"></p><p id="order" class="muted"></p><p id="payment-status" aria-live="polite">尚未创建测试单</p><img id="qr" alt="本次一元测试单的支付宝付款码" hidden><p id="expiry" class="muted"></p><button id="refresh" type="button">刷新原单结果</button><p id="paid-callback" class="muted"></p><p id="acceptance" aria-live="polite"></p><p id="error" role="alert"></p>
</main><script nonce="{{.Token}}">
const token={{.Token}};let busy=false,current=null;
const $=id=>document.getElementById(id);
function render(v){current=v;$('callback').textContent=v.callback_url||'临时回调地址准备中';$('callback-state').textContent=v.callback_test_verified?'测试通知已验签通过，可以生成 1 元付款码。':v.secret_saved?'密钥已加密保存，等待测试通知验签。':'请先登记地址并保存独立回调密钥。';$('callback-state').className=v.callback_test_verified?'good':'muted';$('test').disabled=busy||!v.secret_saved||v.creation_attempted;$('save').disabled=busy||v.creation_attempted;$('create').disabled=busy||!v.callback_test_verified||!!v.order_id;$('create').textContent=v.creation_attempted&&!v.order_id?'恢复原来的 1 元测试单':'生成这笔 1 元付款码';$('merchant').textContent='本机测试编号：'+v.merchant_order_no;$('order').textContent=v.order_id?'上游订单号：'+v.order_id:'';const labels={not_created:'尚未创建测试单',pending:'等待支付宝付款',paid:'上游已确认付款 1.00 元',expired:'付款窗口已结束，请刷新原单核对',closed:'上游已关闭原单',refunded:'上游显示已退款',partially_refunded:'上游显示部分退款'};$('payment-status').textContent=labels[v.payment_status]||'结果待核对';const show=!!v.qr_image_data_url&&v.payment_status==='pending'&&Date.parse(v.expires_at)>Date.now();$('qr').hidden=!show;if(show)$('qr').src=v.qr_image_data_url;else $('qr').removeAttribute('src');$('expiry').textContent=show?'付款码有效至：'+new Date(v.expires_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'';$('paid-callback').textContent=v.paid_callback_verified?'支付成功通知：验签通过':'支付成功通知：等待接收';$('acceptance').textContent=v.passed?'支付测试通过：上游查单确认付款，支付通知验签通过。':'';$('acceptance').className=v.passed?'good':'';}
async function status(){const r=await fetch('/status',{headers:{'X-Check-Token':token},cache:'no-store'});if(!r.ok)throw Error('本机状态读取失败');render(await r.json());}
async function action(path,data={}){if(busy)return false;busy=true;$('error').textContent='';if(current)render(current);try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Check-Token':token},body:JSON.stringify(data),cache:'no-store'});if(!r.ok)throw Error(await r.text());render(await r.json());return true;}catch(e){$('error').textContent=e.message;return false;}finally{busy=false;if(current)render(current);}}
$('setup').addEventListener('submit',async event=>{event.preventDefault();const value=$('secret').value;$('secret').value='';const saved=await action('/setup',{webhook_secret:value});if(saved&&current?.secret_saved&&!current.creation_attempted)await action('/test-notification');});
$('test').onclick=()=>action('/test-notification');$('create').onclick=()=>action('/create');$('refresh').onclick=()=>action('/refresh');
status().catch(e=>$('error').textContent=e.message);
setInterval(async()=>{if(busy)return;try{if(current?.order_id&&['pending','paid','expired'].includes(current.payment_status)&&!current.passed)await action('/refresh');else await status();}catch(e){$('error').textContent=e.message;}},7000);
</script></html>
